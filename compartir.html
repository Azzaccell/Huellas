/* ============ HUELLAS · estilos ============ */
:root{
  --cream:#FFF6EA; --paper:#FFFDF8; --ink:#1B1A2E; --ink-2:#4A4860; --muted:#8A879C;
  --orange:#FF6B35; --orange-2:#FF8F5E; --violet:#7B61FF; --mint:#1DBF73; --yellow:#FFC93C; --red:#FF4D4D;
  --line:rgba(27,26,46,.1); --shadow:0 20px 50px -20px rgba(27,26,46,.25); --r:28px;
  --night:#1B1A2E; --surface:#FFFFFF; --glass:rgba(255,253,248,.78); --map-bg:#EFE7D8; --map-ring:#D9CBB4; --map-road:#FFFFFF; --map-river:#9CC9E8; --map-label:#8A7F6E; --ink-fixed:#1B1A2E;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'DM Sans',system-ui,sans-serif;
  --nav-h:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
main{overflow-x:clip}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{font-family:var(--f-body);background:var(--cream);color:var(--ink);line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
::selection{background:var(--orange);color:#fff}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.02;letter-spacing:-.025em;font-weight:800}
.wrap{width:min(1200px,100% - 32px);margin-inline:auto}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--orange)}
.eyebrow::before{content:'';width:22px;height:2px;background:currentColor;border-radius:2px}
.h-xl{font-size:clamp(2.8rem,8vw,7.2rem)}
.h-lg{font-size:clamp(2.2rem,5.4vw,4.6rem)}
.h-md{font-size:clamp(1.6rem,3vw,2.4rem)}
.lead{font-size:clamp(1.05rem,1.5vw,1.25rem);color:var(--ink-2);max-width:56ch}
.hl{color:var(--orange);font-style:italic}
.scribble{position:relative;white-space:nowrap}
.scribble svg{position:absolute;left:-4%;bottom:-.18em;width:108%;height:.4em;overflow:visible}
.scribble path{fill:none;stroke:var(--yellow);stroke-width:8;stroke-linecap:round}

/* ---------- modo oscuro (sigue al sistema o al tema elegido) ---------- */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --cream:#14131F; --paper:#1E1D2D; --surface:#2A2940; --ink:#F4EEE5; --ink-2:#C9C4D6; --muted:#9A96AE;
  --line:rgba(244,238,229,.12); --shadow:0 20px 50px -20px rgba(0,0,0,.6); --night:#2A2842; --glass:rgba(30,29,45,.8);
  --map-bg:#1B1A29; --map-ring:#3A3754; --map-road:#2E2C45; --map-river:#2D4F6E; --map-label:#8C87A6; color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#14131F; --paper:#1E1D2D; --surface:#2A2940; --ink:#F4EEE5; --ink-2:#C9C4D6; --muted:#9A96AE;
  --line:rgba(244,238,229,.12); --shadow:0 20px 50px -20px rgba(0,0,0,.6); --night:#2A2842; --glass:rgba(30,29,45,.8);
  --map-bg:#1B1A29; --map-ring:#3A3754; --map-road:#2E2C45; --map-river:#2D4F6E; --map-label:#8C87A6; color-scheme:dark}

/* mapa vectorial de Santa Cruz (anillos) */
.ring-label{font:700 10px/1 var(--f-body);color:var(--map-label);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;transform:translate(-50%,-50%)}
.zone-label{font:600 11px/1 var(--f-body);color:var(--ink-2);white-space:nowrap;transform:translate(-50%,-50%);opacity:.8}
.zone-label b{display:block;font-family:var(--f-display);font-size:13px;color:var(--ink)}
/* ---------- botones ---------- */
.btn{--bg:var(--night);--fg:#fff;display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:999px;background:var(--bg);color:var(--fg);font-weight:700;font-size:1rem;position:relative;overflow:hidden;isolation:isolate;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;white-space:nowrap}
.btn::after{content:'';position:absolute;inset:0;background:var(--orange);transform:translateY(101%);border-radius:inherit;transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 14px 30px -12px rgba(255,107,53,.7)}
.btn:hover::after{transform:none}
.btn--orange{--bg:var(--orange)} .btn--orange::after{background:var(--night)}
.btn--ghost{--bg:transparent;--fg:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn--ghost:hover{--fg:#fff}
.btn--light{--bg:var(--surface);--fg:var(--ink)}
.btn--sm{padding:10px 16px;font-size:.9rem}
.btn:disabled{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;font-size:.88rem;transition:.25s;white-space:nowrap}
.chip.on,.chip:hover{background:var(--night);color:#fff;box-shadow:none}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:700;color:#fff;background:var(--c,var(--ink))}

/* ---------- navegación ---------- */
.nav{position:fixed;inset:14px 0 auto;z-index:50;transition:transform .5s cubic-bezier(.7,0,.2,1)}
.nav.hide{transform:translateY(-130%)}
.nav__in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 10px 10px 22px;border-radius:999px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);box-shadow:0 10px 30px -15px rgba(27,26,46,.3),inset 0 0 0 1px rgba(255,255,255,.7)}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.03em}
.logo__paw{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--orange);color:#fff;transform:rotate(-8deg);transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.logo:hover .logo__paw{transform:rotate(12deg) scale(1.1)}
.nav__links{display:flex;gap:4px}
.nav__links a{padding:10px 16px;border-radius:999px;font-weight:600;font-size:.95rem;transition:.25s;position:relative}
.nav__links a:hover{background:var(--line)}
.nav__links a.active{background:var(--night);color:#fff}
.tabbar{display:none}

/* ---------- transición de página ---------- */
.curtain{position:fixed;inset:0;z-index:100;pointer-events:none;display:grid;place-items:center;visibility:hidden}
.curtain__panel{position:absolute;inset:0;background:var(--orange);transform-origin:bottom}
.curtain__panel--2{background:var(--night)}
.curtain__paw{position:relative;font-size:clamp(3rem,10vw,6rem);display:flex;gap:.2em}
.curtain__paw span{display:inline-block}

/* ---------- hero ---------- */
.hero{padding:calc(var(--nav-h) + 60px) 0 40px;position:relative;overflow:hidden}
.hero__grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1 .line{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .line>span{display:inline-block}
.hero__cta{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0 34px}
.hero__proof{display:flex;align-items:center;gap:14px;font-size:.92rem;color:var(--ink-2)}
.avatars{display:flex}
.avatars span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.15rem;border:3px solid var(--cream);margin-left:-10px;background:var(--c)}
.avatars span:first-child{margin:0}
.hero__phone{position:relative;justify-self:center;width:min(340px,80vw);aspect-ratio:9/16.5;border-radius:44px;padding:10px;background:var(--night);box-shadow:var(--shadow),0 40px 80px -30px rgba(255,107,53,.5);transform:rotate(4deg)}
.hero__phone video,.hero__phone img{width:100%;height:100%;object-fit:cover;border-radius:34px}
.hero__phone{z-index:2}

/* historias de mascotas (fila tipo red social) */
.stories{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 18px;margin-bottom:10px;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.story{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;width:74px;scroll-snap-align:start}
.story small{font-size:.75rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story__ring{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(var(--orange),var(--yellow),var(--violet),var(--orange));display:block;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.story__ring.lost{background:var(--red);animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 5px rgba(255,77,77,.25)}}
.story__ring>*{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--cream);background:var(--paper);display:grid;place-items:center;overflow:hidden}
.story__ring .pet-card__emoji{font-size:1.8rem}
.story:hover .story__ring{transform:scale(1.08) rotate(-4deg)}
.story--add .story__ring{background:var(--line)}
.story__plus{font-size:1.8rem;font-weight:800;color:var(--orange)}

/* collage de polaroids alrededor del celular */
.collage{position:relative;padding:20px 0 30px}
.polaroid{position:absolute;z-index:3;width:clamp(120px,15vw,170px);padding:8px 8px 10px;background:#FFFDF8;border-radius:10px;box-shadow:var(--shadow);color:#1B1A2E}
.polaroid img,.polaroid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.polaroid figcaption{font-family:var(--f-display);font-weight:800;font-size:1rem;margin-top:6px;line-height:1.1}
.polaroid figcaption span{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:#8A879C}
.polaroid::before{content:'';position:absolute;top:-10px;left:50%;width:56px;height:20px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,201,60,.75);border-radius:3px}
.polaroid--0{top:0;left:-6%;rotate:-9deg}
.polaroid--1{top:38%;right:-8%;rotate:7deg}
.polaroid--2{bottom:0;left:-2%;rotate:4deg}
.avatars span{overflow:hidden}
.avatars span img,.avatars span video{width:100%;height:100%;object-fit:cover}
.avatars .pet-card__emoji{font-size:1rem}
img{font-size:.8rem}
.feed-layout>*,.publish-layout>*,.profile>*{min-width:0}
.hero__phone-ui{position:absolute;inset:10px;border-radius:34px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 30%,transparent 55%,rgba(0,0,0,.7));color:#fff}
.hero__phone-ui .row{display:flex;align-items:center;gap:10px}
.hero__phone-ui .pfp{width:36px;height:36px;border-radius:50%;background:var(--orange);display:grid;place-items:center}
.sticker{position:absolute;z-index:3;padding:12px 16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:10px;white-space:nowrap}
.sticker small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.sticker .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;background:var(--c,var(--cream))}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1}

/* ---------- video banner ---------- */
.reel{padding:20px 0 80px}
.reel__frame{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/8;background:var(--night);will-change:clip-path}
.reel__frame video{width:100%;height:100%;object-fit:cover}
.reel__over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(20px,4vw,48px);background:linear-gradient(0deg,rgba(27,26,46,.85),transparent 60%);color:#fff}
.reel__over h2{max-width:16ch}

/* ---------- marquee ---------- */
.marquee{overflow:hidden;background:var(--night);color:#FFF6EA;padding:20px 0;transform:rotate(-2deg);margin:0 -20px;position:relative;z-index:2}
.marquee__track{display:flex;gap:44px;width:max-content;animation:mq 30s linear infinite;font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,3vw,2.4rem)}
.marquee__track span{display:flex;align-items:center;gap:44px}
.marquee__track i{font-style:normal;color:var(--orange)}
@keyframes mq{to{transform:translateX(-50%)}}

/* ---------- secciones ---------- */
.section{padding:clamp(80px,12vw,150px) 0;position:relative}
.section__head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:50px;flex-wrap:wrap}
.section__head h2{max-width:14ch}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.feature{background:var(--paper);border-radius:var(--r);padding:30px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line);transition:transform .5s cubic-bezier(.3,1.4,.5,1),box-shadow .4s;transform-style:preserve-3d}
.feature:hover{box-shadow:var(--shadow)}
.feature__ico{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;font-size:1.8rem;background:var(--c);margin-bottom:22px;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.feature:hover .feature__ico{transform:rotate(-10deg) scale(1.1)}
.feature h3{font-size:1.45rem;margin-bottom:10px}
.feature p{color:var(--ink-2)}
.feature--big{grid-column:span 2;background:var(--night);color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.feature--big p{color:rgba(255,255,255,.7)}
.feature--big .mini-map{height:100%;min-height:230px;border-radius:20px;overflow:hidden;position:relative;background:#2a2940}
.feature--accent{background:var(--orange);color:#fff}
.feature--accent p{color:rgba(255,255,255,.85)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}
.stat{padding:28px;border-radius:var(--r);background:var(--c);color:var(--fg,var(--ink-fixed))}
.stat b{font-family:var(--f-display);font-size:clamp(2.4rem,5vw,3.8rem);display:block;line-height:1;letter-spacing:-.04em}
.stat span{font-weight:600;opacity:.8}

/* cómo funciona (horizontal) */
.how{background:var(--night);color:#fff;overflow:hidden}
.how .eyebrow{color:var(--yellow)}
.how__track{display:flex;gap:24px;padding:0 max(16px,calc((100vw - 1200px)/2));width:max-content}
.how__intro{width:min(420px,80vw);flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:20px}
.how__intro p{color:rgba(255,255,255,.7)}
.step{width:min(400px,80vw);flex-shrink:0;border-radius:var(--r);padding:34px;background:#26253b;display:flex;flex-direction:column;gap:16px;min-height:440px;position:relative;overflow:hidden}
.step__n{font-family:var(--f-display);font-weight:800;font-size:6rem;line-height:.8;color:var(--c);opacity:.95}
.step h3{font-size:1.8rem}
.step p{color:rgba(255,255,255,.7)}
.step__emoji{position:absolute;right:-10px;bottom:-20px;font-size:9rem;opacity:.12;transform:rotate(-15deg)}

/* tarjetas de mascota */
.pets-rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 16px 30px;margin:0 -16px;scrollbar-width:none;cursor:grab}
.pets-rail::-webkit-scrollbar{display:none}
.pet-card{flex:0 0 min(290px,74vw);scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);transition:transform .5s cubic-bezier(.3,1.4,.5,1),box-shadow .4s;position:relative}
.pet-card:hover{transform:translateY(-8px) rotate(-1deg);box-shadow:var(--shadow)}
.pet-card__media{aspect-ratio:4/5;position:relative;background:var(--accent);overflow:hidden}
.pet-card__media video,.pet-card__media img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.pet-card:hover .pet-card__media video{transform:scale(1.06)}
.pet-card__emoji{width:100%;height:100%;display:grid;place-items:center;font-size:7rem;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),transparent 60%),var(--accent)}
.pet-card__badge{position:absolute;top:14px;left:14px}
.pet-card__body{padding:18px 20px 22px}
.pet-card__body h3{font-size:1.5rem;display:flex;justify-content:space-between;align-items:center}
.pet-card__body p{color:var(--muted);font-size:.9rem}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.traits span{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--cream)}

/* comparativa */
.compare{border-radius:var(--r);overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.compare__row{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center;border-top:1px solid var(--line)}
.compare__row:first-child{border:0;font-family:var(--f-display);font-weight:800;font-size:1.1rem}
.compare__row>*{padding:18px 24px}
.compare__row>:nth-child(2){background:rgba(255,107,53,.08);text-align:center;font-weight:700}
.compare__row>:nth-child(3){text-align:center;color:var(--muted)}
.compare__row:first-child>:nth-child(2){background:var(--orange);color:#fff}

/* testimonios */
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.quote{color:var(--ink-fixed);padding:30px;border-radius:var(--r);background:var(--c);display:flex;flex-direction:column;gap:20px;justify-content:space-between}
.quote p{font-family:var(--f-display);font-size:1.3rem;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.quote footer{display:flex;align-items:center;gap:12px;font-size:.9rem}
.quote footer span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:1.3rem}

/* parallax image */
.parallax{border-radius:var(--r);overflow:hidden;position:relative;height:clamp(300px,50vw,560px)}
.parallax img{position:absolute;inset:-15% 0;width:100%;height:130%;object-fit:cover}
.parallax__txt{position:absolute;inset:0;display:flex;align-items:center;padding:clamp(24px,5vw,70px);background:linear-gradient(90deg,rgba(27,26,46,.75),transparent 70%);color:#fff}

/* faq */
.faq{display:grid;gap:12px;max-width:820px}
.faq details{background:var(--paper);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.faq summary{list-style:none;padding:22px 26px;font-weight:700;font-size:1.1rem;cursor:pointer;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';font-family:var(--f-display);font-size:1.6rem;line-height:1;transition:transform .3s;color:var(--orange)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding:0 26px 22px;color:var(--ink-2)}

/* CTA */
.cta{border-radius:calc(var(--r) * 1.4);background:var(--orange);color:#fff;padding:clamp(40px,7vw,90px);text-align:center;position:relative;overflow:hidden}
.cta h2{margin:0 auto 20px;max-width:14ch}
.cta p{margin:0 auto 34px;color:rgba(255,255,255,.9);max-width:50ch}
.cta .paws{position:absolute;inset:0;pointer-events:none;opacity:.18;font-size:3rem}
.cta .paws span{position:absolute}

footer.foot{padding:70px 0 120px;color:var(--ink-2)}
.foot__grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:30px}
.foot h4{font-size:1rem;margin-bottom:12px;color:var(--ink)}
.foot a{display:block;padding:4px 0;transition:color .2s}
.foot a:hover{color:var(--orange)}
.foot__big{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,18vw,15rem);line-height:.8;letter-spacing:-.06em;color:var(--ink);margin-top:60px;white-space:nowrap;overflow:hidden}

/* ---------- páginas internas ---------- */
.page{padding:calc(var(--nav-h) + 50px) 0 100px;min-height:100vh}
.page__head{margin-bottom:34px}
.page__head h1{margin:12px 0 14px}

/* mapa */
.mapwrap{display:grid;grid-template-columns:360px 1fr;gap:18px;height:calc(100vh - var(--nav-h) - 70px);min-height:560px}
.mapside{display:flex;flex-direction:column;gap:12px;min-height:0}
.mapside__list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.map{border-radius:var(--r);overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line);background:var(--map-bg);z-index:0}
.map__hint{position:absolute;z-index:500;left:50%;top:16px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:.88rem;box-shadow:var(--shadow);white-space:nowrap}
.map__tools{position:absolute;z-index:500;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px}
.alert-item{display:flex;gap:12px;padding:12px;border-radius:20px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:.25s;text-align:left;width:100%}
.alert-item:hover,.alert-item.on{box-shadow:inset 0 0 0 2px var(--ink);transform:translateX(4px)}
.thumb{width:64px;height:64px;flex-shrink:0;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:2rem;background:var(--c,var(--cream))}
.thumb video,.thumb img{width:100%;height:100%;object-fit:cover}
.alert-item h4{font-size:1.05rem;letter-spacing:-.01em;display:flex;gap:8px;align-items:center}
.alert-item p{font-size:.82rem;color:var(--muted)}
.pin{width:46px;height:46px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.45);border:3px solid #fff;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.pin span{transform:rotate(45deg);font-size:1.25rem}
.pin.pulse::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:3px solid var(--c);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.leaflet-marker-icon:hover .pin{transform:rotate(-45deg) scale(1.18)}
.leaflet-popup-content-wrapper{border-radius:20px;font-family:var(--f-body)}
.leaflet-popup-content{margin:14px 16px}
.pop h4{font-family:var(--f-display);font-size:1.15rem;margin-bottom:2px}
.pop p{margin:0!important;color:var(--muted);font-size:.82rem}
.pop button{margin-top:10px;padding:8px 14px;border-radius:999px;background:var(--night);color:#fff;font-weight:700;font-size:.82rem}
/* ---------- cuenta / Google ---------- */
.nav__end{display:flex;align-items:center;gap:10px}
.nav__acct{display:flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;font-weight:700;font-size:.92rem;transition:.25s;box-shadow:inset 0 0 0 1.5px var(--line)}
.nav__acct:hover,.nav__acct.active{background:var(--line)}
.uavatar{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex-shrink:0;background:conic-gradient(var(--orange),var(--yellow),var(--violet),var(--orange));color:#fff;font-family:var(--f-display);font-weight:800;line-height:1}
.uavatar img{width:100%;height:100%;object-fit:cover}
.tabbar .uavatar{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.gbtn{--g-bg:#FFFFFF;--g-line:#747775;--g-fg:#1F1F1F;display:inline-flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:400px;padding:14px 20px;border-radius:999px;background:var(--g-bg);color:var(--g-fg);box-shadow:inset 0 0 0 1px var(--g-line);font-weight:600;font-size:1rem;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .3s}
.gbtn:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px var(--g-line),0 12px 26px -14px rgba(0,0,0,.45)}
.gbtn:disabled{opacity:.6;transform:none;cursor:progress}
.gbtn:focus-visible,.nav__acct:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
.acct{display:flex;flex-direction:column;gap:clamp(28px,5vw,48px);max-width:960px}
.acct__join{max-width:620px;margin-inline:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:clamp(30px,5vw,54px)}
.acct__join h1{margin:0}
.acct__join .lead{margin:0 auto}
.acct__faces{justify-content:center;margin-bottom:4px}
.acct__faces span{width:56px;height:56px;margin-left:-14px;border-width:4px}
.perks{list-style:none;display:grid;gap:12px;width:100%;text-align:left;margin:6px 0}
.perks li{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:20px;background:var(--cream)}
.perks__ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:var(--surface);flex-shrink:0}
.perks p{font-size:.88rem;color:var(--ink-2)}
.acct__fine{font-size:.8rem;color:var(--muted);max-width:44ch}
.acct__head{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.acct__who{flex:1;min-width:200px}
.acct__who h1{margin:6px 0 2px}
.acct__stats{display:flex;gap:26px}
.acct__stats b{font-family:var(--f-display);font-size:1.8rem;display:block;line-height:1}
.acct__stats span{font-size:.8rem;color:var(--muted)}
.acct__alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.byline-img{width:16px;height:16px;border-radius:50%;vertical-align:-3px;margin-right:4px;display:inline-block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gbtn{--g-bg:#131314;--g-line:#8E918F;--g-fg:#E3E3E3}}
:root[data-theme="dark"] .gbtn{--g-bg:#131314;--g-line:#8E918F;--g-fg:#E3E3E3}
.nav__links a{white-space:nowrap}
@media (max-width:1100px){
  .nav__acct{padding:3px}
  .nav__acct-label{display:none}
  .nav__links a{padding:10px 12px}
}
@media (max-width:900px){
  .nav__cta{padding:10px 14px}
  .nav__links a{padding:9px 9px;font-size:.88rem}
}
@media (max-width:720px){
  .nav__acct{padding:3px}
  .nav__acct-label{display:none}
  .nav__in{padding:8px 8px 8px 18px}
  .acct__head{flex-direction:column;text-align:center}
  .acct__stats{justify-content:center}
}

.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mint);margin-right:6px;animation:ring 1.6s ease-in-out infinite;vertical-align:middle}
.tiles{filter:saturate(.75) sepia(.12) brightness(1.03)}
.tiles-dark{filter:invert(1) hue-rotate(200deg) saturate(.4) brightness(.85) contrast(.9)}
.thumb .pet-card__emoji{font-size:inherit}
.me-dot{width:18px;height:18px;border-radius:50%;background:#3B82F6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.3)}

/* formularios */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--paper);border-radius:var(--r);padding:clamp(20px,3vw,34px);box-shadow:inset 0 0 0 1px var(--line)}
.field{display:flex;flex-direction:column;gap:8px}
.field--full{grid-column:1/-1}
.field label{font-weight:700;font-size:.9rem}
.input{width:100%;padding:14px 16px;border-radius:16px;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);transition:.2s;outline:none}
.card .input{background:var(--cream);box-shadow:inset 0 0 0 1.5px transparent}
.card .input:focus{box-shadow:inset 0 0 0 2px var(--orange);background:var(--surface)}
.input:focus{box-shadow:inset 0 0 0 2px var(--orange);background:var(--surface)}
textarea.input{resize:vertical;min-height:110px}
.seg{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.seg button{padding:16px 10px;border-radius:18px;background:var(--cream);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.25s;box-shadow:inset 0 0 0 2px transparent}
.seg button em{font-style:normal;font-size:1.7rem;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.seg button.on{background:var(--surface);box-shadow:inset 0 0 0 2px var(--c,var(--ink))}
.seg button.on em{transform:scale(1.25) rotate(-8deg)}
.drop{border:2px dashed var(--line);border-radius:20px;padding:24px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.2s;background:var(--cream)}
.drop:hover{border-color:var(--orange)}
.drop img{width:90px;height:90px;object-fit:cover;border-radius:14px}
.pick-map{height:300px;border-radius:20px;overflow:hidden}
.publish-layout{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;align-items:start}
.preview-sticky{position:sticky;top:calc(var(--nav-h) + 30px)}

/* comunidad */
.feed-layout{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.post{background:var(--paper);border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;margin-bottom:18px}
.post__head{display:flex;align-items:center;gap:12px;padding:16px 20px}
.post__head .thumb{width:44px;height:44px;border-radius:50%;font-size:1.3rem}
.post__head small{color:var(--muted)}
.post__media{aspect-ratio:16/10;background:var(--c);display:grid;place-items:center;font-size:7rem;overflow:hidden;position:relative}
.post__media video,.post__media img{width:100%;height:100%;object-fit:cover}
.post__body{padding:16px 20px 20px}
.post__actions{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.like{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--cream);font-weight:700;font-size:.88rem;transition:.2s}
.like:hover{background:rgba(255,107,53,.16)}
.like.on{background:rgba(255,77,77,.16);color:var(--red)}
.like.on em{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.like em{font-style:normal}
@keyframes pop{50%{transform:scale(1.6)}}
.side-card{background:var(--paper);border-radius:var(--r);padding:22px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:18px}
.side-card h3{font-size:1.2rem;margin-bottom:12px}
.mini-pet{display:flex;align-items:center;gap:12px;padding:8px 0}
.mini-pet .thumb{width:46px;height:46px;border-radius:50%}
.mini-pet b{display:block;line-height:1.1}
.mini-pet small{color:var(--muted)}
.pets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.pets-grid .pet-card{flex:none}

/* perfil */
.profile{display:grid;grid-template-columns:420px 1fr;gap:34px;align-items:start}
.profile__media{border-radius:var(--r);overflow:hidden;aspect-ratio:4/5;background:var(--accent);position:sticky;top:calc(var(--nav-h) + 30px)}
.profile__media video,.profile__media img{width:100%;height:100%;object-fit:cover}
.profile__stats{display:flex;flex-wrap:wrap;gap:16px 28px;margin:22px 0}
.profile__stats>div{min-width:0}
.profile__stats b{font-family:var(--f-display);font-size:1.8rem;display:block;line-height:1}
.profile__stats span{font-size:.85rem;color:var(--muted)}
.qr{display:grid;grid-template-columns:repeat(9,1fr);width:120px;gap:2px;padding:10px;background:#fff;border-radius:14px}
.qr i{aspect-ratio:1;background:var(--night);border-radius:2px}
.qr i.o{background:transparent}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.modal__bg{position:absolute;inset:0;background:rgba(27,26,46,.55);backdrop-filter:blur(6px)}

    { type: 'encontrado', species: 'perro', name: 'Golden con pañuelo', breed: 'Golden retriever', color: 'Dorado', zone: 'Urubó', h: 16, desc: 'Apareció en el condominio con pañuelo azul. Muy cariñoso.', likes: 41 },
    { type: 'perdido', species: 'gato', name: 'Tigre', breed: 'Mestizo', color: 'Naranja y blanco', zone: 'Mutualista', h: 3, desc: 'Gato naranja con pecho blanco. Último avistamiento en el mercado.', likes: 22, video: 'media/v3.mp4' },
    { type: 'reunido', species: 'perro', name: 'Lola', breed: 'Poodle', color: 'Blanco', zone: 'Villa 1ro de Mayo', h: 72, desc: 'Volvió a casa en menos de 24h. ¡Gracias comunidad HUELLAS!', likes: 180 },
    { type: 'visto', species: 'perro', name: 'Perrito negro', breed: 'Mestizo', color: 'Negro', zone: 'Pampa de la Isla', h: 1, desc: 'Corriendo por la doble vía, cojea de la pata trasera.', likes: 6 },
  ].map((r, i) => {
    const [lat, lng] = jitter(ZONES[r.zone]);
    return { id: 'r' + (i + 1), lat, lng, date: ago(r.h), contact: '5917000000' + (i % 10), comments: [], liked: false, photo: PHOTOS[r.name] || null, ...r };
  });

  // Fotos de Pixabay (licencia libre, sin atribución obligatoria) guardadas en media/pets
  const P = 'media/pets/';
  const PHOTOS = {
    'Toby': P + 'toby.jpg', 'Rocky': P + 'rocky.jpg', 'Lola': P + 'lola.jpg', 'Golden con pañuelo': P + 'golden.jpg',
    'Cachorro café': P + 'cachorro.jpg', 'Perrito negro': P + 'negrito.jpg', 'Gato atigrado': P + 'atigrado.jpg',
  };

  const seedPets = () => [
    { id: 'p1', name: 'Canela', species: 'gato', breed: 'Mestiza', age: '2 años', owner: 'Valeria R.', zone: 'Equipetrol', video: 'media/v0.mp4', bio: 'Reina del sofá, experta en siestas y en pedir comida a las 6 a.m.', traits: ['Dormilona', 'Glotona', 'Con chip'], followers: 1240, accent: '#FF6B35' },
    { id: 'p2', name: 'Mishi', species: 'gato', breed: 'Mestizo', age: '1 año', owner: 'Diego A.', zone: 'Urbarí', video: 'media/v1.mp4', bio: 'Tímido pero curioso. Ahora mismo está perdido, ¡ayúdanos a encontrarlo!', traits: ['Tímido', 'Esterilizado'], followers: 860, accent: '#7B61FF', lost: true },
    { id: 'p3', name: 'Luna', species: 'gato', breed: 'Bicolor', age: '4 años', owner: 'Camila S.', zone: 'Sirari', video: 'media/v2.mp4', bio: 'Patas blancas, corazón enorme. Aprendió a abrir la puerta del refri.', traits: ['Inteligente', 'Vacunada'], followers: 2310, accent: '#1DBF73' },
    { id: 'p4', name: 'Nube', species: 'gato', breed: 'Siamés', age: '3 años', owner: 'Andrés M.', zone: 'Las Palmas', video: 'media/v4.mp4', bio: 'Se perdió 2 días y volvió gracias a HUELLAS. Hoy es la embajadora del barrio.', traits: ['Reunida 💚', 'Con chip'], followers: 5120, accent: '#FFB020' },
    { id: 'p5', name: 'Tigre', species: 'gato', breed: 'Naranja', age: '5 años', owner: 'Familia Rojas', zone: 'Mutualista', video: 'media/v3.mp4', bio: 'Comelón profesional. Patrulla el mercado como si fuera el dueño.', traits: ['Callejero', 'Sociable'], followers: 970, accent: '#FF4D4D' },
    { id: 'p6', name: 'Toby', species: 'perro', breed: 'Jack Russell', age: '6 años', owner: 'Jorge P.', zone: 'Equipetrol', photo: P + 'toby.jpg', bio: 'Olfato de detective. Le teme a los cohetes de fin de año.', traits: ['Juguetón', 'Collar rojo'], followers: 640, accent: '#FFB020', lost: true },
    { id: 'p7', name: 'Coco', species: 'perro', breed: 'Dálmata', age: '3 años', owner: 'Lucía V.', zone: 'Urbarí', photo: P + 'coco.jpg', bio: 'Tiene 101 manchas (las contamos). Le encanta mirar la calle desde el balcón.', traits: ['Curiosa', 'Vacunada', 'Con chip'], followers: 3020, accent: '#1B1A2E' },
    { id: 'p8', name: 'Max', species: 'perro', breed: 'Yorkshire terrier', age: '4 años', owner: 'Paola G.', zone: 'Sirari', photo: P + 'max.jpg', bio: 'Pequeño en tamaño, gigante en actitud. Guardián oficial del condominio.', traits: ['Valiente', 'Peluquería al día'], followers: 1580, accent: '#FFB020' },
    { id: 'p9', name: 'Bruno', species: 'perro', breed: 'Pug', age: '5 años', owner: 'Rodrigo C.', zone: 'Centro', photo: P + 'bruno.jpg', bio: 'Ronca más fuerte que su dueño. Fan número uno del pollo broaster.', traits: ['Dormilón', 'Glotón'], followers: 2740, accent: '#FF6B35' },
    { id: 'p10', name: 'Kira', species: 'perro', breed: 'Border collie', age: '2 años', owner: 'Sofía M.', zone: 'Urubó', photo: P + 'kira.jpg', bio: 'La más rápida del parque. Atrapa frisbees y corazones.', traits: ['Atlética', 'Obediente', 'Con chip'], followers: 4210, accent: '#7B61FF' },

  ];

  // Versión liviana de un solo archivo (huellas-movil.html): los medios van incrustados en
  // window.HUELLAS_MEDIA y los dos videos grandes se reemplazan por fotos.
  const LITE = !!window.HUELLAS_LITE;
  const LITE_SWAP = { 'media/v0.mp4': 'media/img2.avif', 'media/v3.mp4': 'media/pets/atigrado.jpg' };
  const M = p => (p && window.HUELLAS_MEDIA && window.HUELLAS_MEDIA[p]) || p;
  const lite = list => {
    if (LITE) list.forEach(x => { if (LITE_SWAP[x.video]) { x.photo = LITE_SWAP[x.video]; x.video = null; } });
    return list;
  };

  const KEY = LITE ? 'huellas:movil1' : 'huellas:v2'; // v2: fotos reales; invalida los datos guardados de la versión anterior
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}

  const state = Vue.reactive(saved && saved.reports ? saved : {
    reports: lite(seedReports()), pets: lite(seedPets()), user: { name: '', zone: '' },
  });
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.warn('No se pudo guardar', e); } };
  Vue.watch(state, save, { deep: true });

  const reset = () => { Object.assign(state, { reports: lite(seedReports()), pets: lite(seedPets()) }); };

  // Distancia en km (haversine)
  const km = (a, b) => {
    const R = 6371, r = x => x * Math.PI / 180;
    const dLat = r(b.lat - a.lat), dLng = r(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };

  // Coincidencias: misma especie, tipo opuesto (perdido ↔ visto/encontrado), < 5 km
  const matches = rep => state.reports
    .filter(o => o.id !== rep.id && o.species === rep.species && o.type !== 'reunido' &&
      ((rep.type === 'perdido') !== (o.type === 'perdido')))
    .map(o => {
      const d = km(rep, o);
      const colorHit = rep.color && o.color && rep.color.toLowerCase().split(/\s+/)[0] === o.color.toLowerCase().split(/\s+/)[0];
      const breedHit = rep.breed && o.breed && rep.breed.toLowerCase() === o.breed.toLowerCase();
      return { r: o, d, score: Math.round(Math.max(0, 60 - d * 10) + (colorHit ? 25 : 0) + (breedHit ? 15 : 0)) };
    })
    .filter(m => m.d < 5 && m.score >= 40)
    .sort((a, b) => b.score - a.score);

  const timeAgo = t => {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 60) return `hace ${Math.max(1, m)} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `hace ${h} h`;
    const d = Math.round(h / 24);
    return `hace ${d} día${d > 1 ? 's' : ''}`;
  };

  return { CENTER, ZONES, TYPES, SPECIES, state, reset, km, matches, timeAgo, M, LITE, lite };
})();

<script>
/* HUELLAS — acciones de datos. Modo local (localStorage) o en línea (Supabase + tiempo real).
   Toda la app escribe a través de HUELLAS.actions; así el mismo código sirve en ambos modos.
   Sesión: anónima por defecto; "Continuar con Google" convierte esa sesión en una cuenta
   (linkIdentity), así lo publicado antes sigue siendo tuyo. */
(() => {
  const H = window.HUELLAS, { state } = H;
  const cfg = window.HUELLAS_CONFIG || {};
  const sb = cfg.supabaseUrl && cfg.supabaseKey && window.supabase
    ? window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, flowType: 'pkce', detectSessionInUrl: true } })
    : null;

  const status = Vue.reactive({ online: false, connecting: !!sb, uid: null, user: null, authBusy: false, hasAuthor: false, googleReady: null });
  const notify = msg => H.onError && H.onError(msg);
  const liked = new Set(state.user.liked || []);
  const followed = new Set(state.user.followed || []);
  const remember = () => { state.user.liked = [...liked]; state.user.followed = [...followed]; };
  // La web abierta como archivo (file://, content:// de WhatsApp) no puede recibir la vuelta de Google
  const hosted = /^https?:$/.test(location.protocol);
  const redirectTo = () => location.origin + location.pathname;

  // ---------- conversión fila de la base ↔ objeto de la app ----------
  const toReport = row => H.lite([{
    id: row.id, type: row.type, species: row.species, name: row.name, breed: row.breed || '', color: row.color || '',
    zone: row.zone || '', lat: row.lat, lng: row.lng, desc: row.description || '', reward: row.reward || '',
    contact: row.contact || '', photo: row.photo, video: row.video, petId: row.pet_id, likes: row.likes,
    date: Date.parse(row.created_at), comments: [], liked: liked.has(row.id),
    ownerId: row.user_id, mine: !!status.uid && row.user_id === status.uid, author: row.author || '', avatar: row.avatar || '',
  }])[0];
  const toPet = row => H.lite([{
    id: row.id, name: row.name, species: row.species, breed: row.breed || '', age: row.age || '', owner: row.owner || '',
    zone: row.zone || '', bio: row.bio || '', traits: row.traits || [], photo: row.photo, video: row.video,
    accent: row.accent || '#FF6B35', followers: row.followers, lost: row.lost,
    ownerId: row.user_id, mine: !!status.uid && row.user_id === status.uid, author: row.author || '', avatar: row.avatar || '',
  }])[0];
  const toComment = row => ({ id: row.id, text: row.text, date: Date.parse(row.created_at), author: row.author || '', avatar: row.avatar || '' });
  // Nombre y foto de Google para guardar junto a lo publicado (solo si la base ya tiene esas columnas)
  const byline = () => (status.hasAuthor && status.user ? { author: status.user.name, avatar: status.user.avatar || null } : {});

  const digits = c => { const d = String(c || '').replace(/\D/g, ''); return d.startsWith('591') ? d : '591' + d; };

  // Sube una foto (data URL comprimida por la app) a Storage y devuelve su URL pública
  async function uploadPhoto(dataUrl) {
    if (!dataUrl || !dataUrl.startsWith('data:')) return dataUrl || null;
    const blob = await (await fetch(dataUrl)).blob();
    const path = `${status.uid}/${Date.now()}-${Math.random().toString(36).slice(2, 7)}.jpg`;
    const { error } = await sb.storage.from('fotos').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    return sb.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  }

  // ---------- sesión ----------
  function setSession(session) {
    const u = session && session.user;
    status.uid = u ? u.id : null;
    if (u && !u.is_anonymous) {
      const m = u.user_metadata || {};
      status.user = { name: m.full_name || m.name || (u.email || '').split('@')[0], email: u.email || '', avatar: m.avatar_url || m.picture || '' };
      if (!state.user.name) state.user.name = status.user.name;
    } else status.user = null;
    // recalcula qué publicaciones son de esta persona
    state.reports.forEach(r => { if (r.ownerId !== undefined) r.mine = !!status.uid && r.ownerId === status.uid; });
    state.pets.forEach(p => { if (p.ownerId !== undefined) p.mine = !!status.uid && p.ownerId === status.uid; });
  }

  // Vuelta de Google: limpia ?code= / ?error= de la dirección y avisa si algo falló
  function handleReturn() {
    const q = new URLSearchParams(location.search);
    const hq = new URLSearchParams((location.hash.split('?')[1]) || '');
    const code = q.get('error_code') || hq.get('error_code');
    const desc = q.get('error_description') || hq.get('error_description');
    if (q.has('code') || code || q.has('error')) {
      try {
        history.replaceState(null, '', location.pathname + (location.hash.startsWith('#/') ? location.hash.split('?')[0] : '#/cuenta'));
        dispatchEvent(new HashChangeEvent('hashchange')); // el router muestra "Mi cuenta"
      } catch (e) {}
    }
    if (code === 'identity_already_exists') {
      // esa cuenta de Google ya existe: entra directamente con ella
      sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: redirectTo() } });
      return true;
    }
    if (code || desc) notify('No se pudo iniciar sesión: ' + (desc || code).replace(/\+/g, ' '));
    return false;
  }

  async function loginGoogle() {
    if (!sb || !status.online) return notify('El inicio de sesión necesita conexión a internet');
    if (!hosted) { location.href = (cfg.siteUrl || '') + '#/cuenta'; return; }
    if (status.googleReady === false) return notify('El inicio con Google todavía no está activado en HUELLAS');
    status.authBusy = true;
    const { data: { session } } = await sb.auth.getSession();
    const opts = { provider: 'google', options: { redirectTo: redirectTo() } };
    // con una sesión anónima se vincula Google a ella para conservar lo publicado
    const res = session && session.user.is_anonymous && sb.auth.linkIdentity
      ? await sb.auth.linkIdentity(opts)
      : await sb.auth.signInWithOAuth(opts);
    if (res.error) {
      // p. ej. vinculación manual desactivada: entrar normalmente con Google
      const again = await sb.auth.signInWithOAuth(opts);
      if (again.error) { status.authBusy = false; notify('No se pudo abrir Google: ' + again.error.message); }
    }
  }

  async function logout() {
    if (!sb) return;
    status.authBusy = true;
    await sb.auth.signOut();
    const res = await sb.auth.signInAnonymously();
    setSession(res.data && res.data.session);
    status.authBusy = false;
    notify('Cerraste sesión');
  }

  // ---------- carga inicial + tiempo real ----------
  async function connect() {
    try {
      // getSession espera a que supabase-js canjee el ?code= de Google; recién después se limpia la dirección
      let { data: { session } } = await sb.auth.getSession();
      if (handleReturn()) return;
      if (!session) {
        const res = await sb.auth.signInAnonymously();
        if (res.error) throw res.error;
        session = res.data.session;
      }
      setSession(session);
      // ¿Está activado el proveedor Google en Supabase? (Authentication → Sign In / Providers)
      fetch(cfg.supabaseUrl + '/auth/v1/settings', { headers: { apikey: cfg.supabaseKey } })
        .then(r => r.json()).then(s => { status.googleReady = !!(s.external && s.external.google); })
        .catch(() => { status.googleReady = false; });
      sb.auth.onAuthStateChange((event, s) => { if (s) setSession(s); if (event === 'SIGNED_IN' && s && !s.user.is_anonymous) notify('👋 ¡Hola, ' + status.user.name + '!'); });

      const [reports, pets, comments] = await Promise.all([
        sb.from('reports').select('*').order('created_at', { ascending: false }).limit(500),
        sb.from('pets').select('*').order('created_at', { ascending: true }).limit(500),
        sb.from('comments').select('*').order('created_at', { ascending: true }).limit(3000),
      ]);
      const err = reports.error || pets.error || comments.error;
      if (err) throw err;
      status.hasAuthor = !!(reports.data[0] && 'author' in reports.data[0]);

      const list = reports.data.map(toReport);
      const byId = Object.fromEntries(list.map(r => [r.id, r]));
      comments.data.forEach(c => byId[c.report_id] && byId[c.report_id].comments.push(toComment(c)));
      state.reports = list;
      state.pets = pets.data.map(toPet);
      status.online = true;
      subscribe();
    } catch (e) {
      console.warn('HUELLAS sin conexión a la base de datos:', e);
      notify('Sin conexión con la comunidad: mostrando datos guardados en este equipo');
    } finally {
      status.connecting = false;
      status.authBusy = false;
    }
  }

  function subscribe() {
    sb.channel('huellas')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'reports' }, ({ eventType, new: row, old }) => {
        const i = state.reports.findIndex(r => r.id === (row && row.id) || r.id === (old && old.id));
        if (eventType === 'DELETE') { if (i > -1) state.reports.splice(i, 1); return; }
        const r = toReport(row);
        if (i > -1) Object.assign(state.reports[i], { ...r, comments: state.reports[i].comments, liked: state.reports[i].liked });
        else state.reports.unshift(r);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pets' }, ({ eventType, new: row, old }) => {
        const i = state.pets.findIndex(p => p.id === (row && row.id) || p.id === (old && old.id));
        if (eventType === 'DELETE') { if (i > -1) state.pets.splice(i, 1); return; }
        if (i > -1) Object.assign(state.pets[i], toPet(row)); else state.pets.unshift(toPet(row));
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, ({ new: row }) => {
        const r = state.reports.find(x => x.id === row.report_id);
        if (r && !r.comments.some(c => c.id === row.id)) r.comments.push(toComment(row));
      })
      .subscribe();
  }

  // ---------- acciones ----------
  const local = {
    async addReport(form) {
      const id = 'r' + Date.now();
      state.reports.unshift({ ...form, id, contact: digits(form.contact), date: Date.now(), likes: 0, liked: false, comments: [], mine: true });
      if (form.petId) { const p = state.pets.find(x => x.id === form.petId); if (p) p.lost = true; }
      return id;
    },
    async addPet(form) {
      const id = 'p' + Date.now();
      state.pets.unshift({ ...form, id, followers: 0, mine: true });
      return id;
    },
    async toggleLike(r) { r.liked = !r.liked; r.likes += r.liked ? 1 : -1; r.liked ? liked.add(r.id) : liked.delete(r.id); remember(); },
    async toggleFollow(p) { const on = !followed.has(p.id); on ? followed.add(p.id) : followed.delete(p.id); p.followers += on ? 1 : -1; remember(); return on; },
    async addComment(r, text) { r.comments.push({ id: Date.now(), text, date: Date.now(), author: state.user.name || '' }); },
    async setReportType(r, type) { r.type = type; },
    async setPetLost(p, lost) { p.lost = lost; },
    async removeReport(id) { const i = state.reports.findIndex(x => x.id === id); if (i > -1) state.reports.splice(i, 1); },
  };

  const remote = {
    async addReport(form) {
      const photo = await uploadPhoto(form.photo);
      const { data, error } = await sb.from('reports').insert({
        type: form.type, species: form.species, name: form.name.trim(), breed: form.breed, color: form.color, zone: form.zone,
        lat: form.lat, lng: form.lng, description: form.desc, reward: form.type === 'perdido' ? form.reward : null,
        contact: digits(form.contact), photo, video: form.video || null, pet_id: form.petId || null, ...byline(),
      }).select().single();
      if (error) throw error;
      if (!state.reports.some(r => r.id === data.id)) state.reports.unshift(toReport(data));
      if (form.petId) { const p = state.pets.find(x => x.id === form.petId); if (p && p.mine) await remote.setPetLost(p, true); }
      return data.id;
    },
    async addPet(form) {
      const photo = await uploadPhoto(form.photo);
      const { data, error } = await sb.from('pets').insert({
        name: form.name.trim(), species: form.species, breed: form.breed, age: form.age, owner: form.owner, zone: form.zone,
        bio: form.bio, traits: form.traits, photo, accent: form.accent, ...byline(),
      }).select().single();
      if (error) throw error;
      if (!state.pets.some(p => p.id === data.id)) state.pets.unshift(toPet(data));
      return data.id;
    },
    async toggleLike(r) {
      await local.toggleLike(r);
      const { data, error } = await sb.rpc('like_report', { rid: r.id, delta: r.liked ? 1 : -1 });
      if (!error && typeof data === 'number') r.likes = data;
    },
    async toggleFollow(p) {
      const on = await local.toggleFollow(p);
      const { data, error } = await sb.rpc('follow_pet', { pid: p.id, delta: on ? 1 : -1 });
      if (!error && typeof data === 'number') p.followers = data;
      return on;
    },
    async addComment(r, text) {
      const { data, error } = await sb.from('comments').insert({ report_id: r.id, text, ...byline() }).select().single();
      if (error) throw error;
      if (!r.comments.some(c => c.id === data.id)) r.comments.push(toComment(data));
    },
    async setReportType(r, type) {
      const { error } = await sb.from('reports').update({ type }).eq('id', r.id);
      if (error) throw error;
      r.type = type;
    },
    async setPetLost(p, lost) {
      const { error } = await sb.from('pets').update({ lost }).eq('id', p.id);
      if (error) throw error;
      p.lost = lost;
    },
    async removeReport(id) {
      const { error } = await sb.from('reports').delete().eq('id', id);
      if (error) throw error;
      await local.removeReport(id);
    },
  };

  // En línea solo si la conexión funcionó; si no, todo sigue en modo local
  const actions = Object.fromEntries(Object.keys(local).map(k => [k, (...a) => (status.online ? remote : local)[k](...a)]));
  // ¿Puede esta persona editar la alerta/mascota? En local: siempre. En línea: solo si es suya.
  const canEdit = item => !status.online || !!item.mine;
  const auth = { login: loginGoogle, logout, enabled: !!(sb && cfg.googleLogin), hosted, siteUrl: cfg.siteUrl || '' };

  Object.assign(H, { actions, status, canEdit, auth });
  if (sb) connect();
})();

</script>
<script>
/* HUELLAS — app (Vue 3 + GSAP/ScrollTrigger + Lenis + Leaflet), sin build step */
const { createApp, ref, reactive, computed, watch, onMounted, onBeforeUnmount, nextTick, markRaw } = Vue;
const { state, TYPES, SPECIES, ZONES, CENTER, matches, timeAgo, km, M, LITE, actions, status, canEdit, auth } = window.HUELLAS;
gsap.registerPlugin(ScrollTrigger);

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- scroll suave (Lenis) sincronizado con ScrollTrigger ---------- */
const lenis = new Lenis({ lerp: 0.1, smoothWheel: !reduced });
lenis.on('scroll', ScrollTrigger.update);
gsap.ticker.add(t => lenis.raf(t * 1000));
gsap.ticker.lagSmoothing(0);

/* ---------- router por hash ---------- */
const ROUTES = [
  ['/', 'page-home'], ['/mapa', 'page-map'], ['/publicar', 'page-publish'],
  ['/comunidad', 'page-community'], ['/registrar', 'page-register'], ['/mascota/:id', 'page-pet'], ['/cuenta', 'page-account'],
];
const parse = (hash = location.hash) => {
  const [path, qs = ''] = (hash.replace(/^#/, '') || '/').split('?');
  const query = Object.fromEntries(new URLSearchParams(qs));
  for (const [pattern, comp] of ROUTES) {
    const keys = [], rx = new RegExp('^' + pattern.replace(/:(\w+)/g, (_, k) => (keys.push(k), '([^/]+)')) + '/?$');
    const m = path.match(rx);
    if (m) return { path, comp, query, params: Object.fromEntries(keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) };
  }
  return { path: '/', comp: 'page-home', query, params: {} };
};
const route = ref(parse());
addEventListener('hashchange', () => { route.value = parse(); });
// Navegación en memoria: funciona igual dentro de un iframe/visor compartido que como sitio normal
const go = p => {
  route.value = parse('#' + p);
  try { history.replaceState(null, '', '#' + p); } catch (e) {}
};
addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  go(a.getAttribute('href').slice(1));
});

/* ---------- UI global: modal, toast ---------- */
const ui = reactive({ modal: null, toast: '' });
let toastT;
const toast = msg => { ui.toast = msg; clearTimeout(toastT); toastT = setTimeout(() => (ui.toast = ''), 3200); };
window.HUELLAS.onError = toast;
const openAlert = id => { ui.modal = id; lenis.stop(); };
const closeAlert = () => { ui.modal = null; lenis.start(); };

const share = async (title, hash) => {
  const url = location.origin + location.pathname + hash;
  try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); toast('🔗 Enlace copiado'); }
  catch (e) { toast('Copia este enlace: ' + url); }
};
const waLink = r => `https://wa.me/${r.contact}?text=${encodeURIComponent(`Hola, te escribo por "${r.name}" en HUELLAS 🐾`)}`;

/* Imagen → JPEG comprimido (mantiene el localStorage liviano) */
const readImage = (file, max = 900) => new Promise((res, rej) => {
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    res(c.toDataURL('image/jpeg', 0.78));
  };
  img.onerror = rej;
  img.src = URL.createObjectURL(file);
});

/* ---------- animaciones por página ---------- */
// gsap.context agrupa tweens y ScrollTriggers de la página para limpiarlos al salir
function usePageFx(root, setup) {
  let ctx;
  onMounted(() => nextTick(() => {
    ctx = gsap.context(() => {
      if (!reduced) {
        ScrollTrigger.batch(root.value.querySelectorAll('[data-reveal]'), {
          start: 'top 90%', once: true,
          onEnter: b => gsap.fromTo(b, { opacity: 0, y: 60, rotate: (i) => (i % 2 ? 1.5 : -1.5) },
            { opacity: 1, y: 0, rotate: 0, duration: 1, ease: 'expo.out', stagger: 0.09, overwrite: true }),
        });
      } else gsap.set('[data-reveal]', { opacity: 1 });
      setup && setup();
    }, root.value);
  }));
  onBeforeUnmount(() => ctx && ctx.revert());
}

/* Entrada determinística: fromTo con valores finales fijos (no se "congela" si se re-ejecuta) */
const FROM_KEYS = ['x', 'y', 'opacity', 'scale', 'rotate'];
const intro = (targets, vars) => {
  const from = {}, to = { clearProps: 'opacity,transform,translate,rotate,scale' };
  for (const k in vars) (FROM_KEYS.includes(k) ? from : to)[k] = vars[k];
  for (const k in from) to[k] = k === 'opacity' || k === 'scale' ? 1 : 0;
  return gsap.fromTo(targets, from, to);
};

/* Autoplay solo cuando el video está visible (ahorra batería/CPU) */
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) { v.preload = 'auto'; v.play().catch(() => {}); } else v.pause();
}), { rootMargin: '100px' });
const vAuto = { mounted: el => io.observe(el), beforeUnmount: el => io.unobserve(el) };

/* Tarjetas que se inclinan con el mouse */
const vTilt = {
  mounted(el) {
    if (reduced || matchMedia('(hover: none)').matches) return;
    el.addEventListener('mousemove', e => {
      const r = el.getBoundingClientRect();
      gsap.to(el, { rotateY: ((e.clientX - r.left) / r.width - .5) * 8, rotateX: -((e.clientY - r.top) / r.height - .5) * 8, transformPerspective: 900, duration: .5 });
    });
    el.addEventListener('mouseleave', () => gsap.to(el, { rotateX: 0, rotateY: 0, duration: .8, ease: 'elastic.out(1,.5)' }));
  },
};

/* Botones magnéticos */
const vMagnet = {
  mounted(el) {
    if (reduced || matchMedia('(hover: none)').matches) return;
    el.addEventListener('mousemove', e => {
      const r = el.getBoundingClientRect();
      gsap.to(el, { x: (e.clientX - r.left - r.width / 2) * .25, y: (e.clientY - r.top - r.height / 2) * .3, duration: .4 });
    });
    el.addEventListener('mouseleave', () => gsap.to(el, { x: 0, y: 0, duration: .7, ease: 'elastic.out(1,.4)' }));
  },
};

/* Huellitas al hacer click en cualquier parte */
addEventListener('pointerdown', e => {
  if (reduced || e.target.closest('.map, .leaflet-container, input, textarea, select')) return;
  const p = document.createElement('div');
  p.className = 'paw-fx'; p.textContent = '🐾';
  p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
  document.body.appendChild(p);
  gsap.fromTo(p, { scale: 0, rotate: gsap.utils.random(-40, 40) }, { scale: 1.4, y: -40, opacity: 0, duration: .9, ease: 'power2.out', onComplete: () => p.remove() });
});

/* ---------- Leaflet helpers ---------- */
// Teselas de OpenStreetMap (gratis, sin API key); el estilo cálido/oscuro se da con filtros CSS
const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
const pinIcon = r => L.divIcon({
  className: '', iconSize: [46, 46], iconAnchor: [23, 52], popupAnchor: [0, -48],
  html: `<div class="pin ${r.type === 'perdido' ? 'pulse' : ''}" style="--c:${TYPES[r.type].color};position:relative"><span>${SPECIES[r.species] || '🐾'}</span></div>`,
});
// Mapa vectorial propio de Santa Cruz (anillos, radiales, río Piraí, barrios).
// Se usa en la versión compartible, donde no se pueden cargar teselas externas.
const VECTOR = !!window.HUELLAS_VECTOR_MAP;
const RINGS = [['1er', 750], ['2do', 1450], ['3er', 2350], ['4to', 3350], ['5to', 4450], ['6to', 5650], ['7mo', 6900], ['8vo', 8200]];
const RADIALS = [ // [rumbo en grados desde el norte, nombre]
  [-12, 'Av. Banzer'], [18, 'Av. Beni'], [48, 'Av. Alemana'], [82, 'Av. V. de Cotoca'], [128, 'Av. Santos Dumont'],
  [168, 'Av. Grigotá'], [205, 'Doble vía La Guardia'], [240, 'Av. Roca y Coronado'], [300, 'Av. San Martín'], [335, 'Av. Cristo Redentor'],
];
const offset = ([lat, lng], m, deg) => {
  const r = deg * Math.PI / 180;
  return [lat + (m * Math.cos(r)) / 111320, lng + (m * Math.sin(r)) / (111320 * Math.cos(lat * Math.PI / 180))];
};
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function drawCity(map, { labels = true } = {}) {
  const ring = cssVar('--map-ring'), road = cssVar('--map-road'), river = cssVar('--map-river'), dark = cssVar('--night');
  // calles radiales primero, anillos encima
  RADIALS.forEach(([deg]) => L.polyline([offset(CENTER, 300, deg), offset(CENTER, 9600, deg)], { color: road, weight: 5, interactive: false }).addTo(map));
  RINGS.forEach(([name, m], i) => {
    L.circle(CENTER, { radius: m, color: ring, weight: i < 4 ? 4 : 3, fill: false, interactive: false }).addTo(map);
    if (labels) L.marker(offset(CENTER, m, 0), { interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="ring-label">${name} anillo</div>` }) }).addTo(map);
  });
  // río Piraí al oeste de la ciudad
  L.polyline([[-17.70, -63.215], [-17.73, -63.222], [-17.76, -63.214], [-17.79, -63.221], [-17.82, -63.214], [-17.86, -63.222]], { color: river, weight: 12, opacity: .9, lineCap: 'round', interactive: false }).addTo(map);
  // plaza 24 de Septiembre
  L.circleMarker(CENTER, { radius: 6, color: dark, fillColor: cssVar('--orange'), fillOpacity: 1, weight: 2, interactive: false }).addTo(map);
  if (labels) {
    Object.entries(ZONES).forEach(([z, ll]) => L.marker(ll, { interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="zone-label">${z}</div>` }) }).addTo(map));
    L.marker([-17.775, -63.226], { interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="ring-label" style="color:var(--map-river)">Río Piraí</div>' }) }).addTo(map);
  }
}
const makeMap = (el, opts = {}) => {
  const map = L.map(el, { zoomControl: false, attributionControl: true, ...opts }).setView(opts.center || CENTER, opts.zoom || 13);
  const vector = () => { if (map._city) return; map._city = true; drawCity(map, { labels: !opts.static }); };
  if (VECTOR) vector();
  else {
    // OpenStreetMap; si no hay internet o el visor bloquea las teselas, se dibuja el mapa de anillos
    let loaded = false;
    const tiles = L.tileLayer(TILE, { attribution: ATTR, maxZoom: 19, className: opts.dark ? 'tiles-dark' : 'tiles' })
      .on('tileload', () => { loaded = true; })
      .on('tileerror', () => { if (!loaded) { map.removeLayer(tiles); vector(); } })
      .addTo(map);
    setTimeout(() => { if (!loaded && map.hasLayer(tiles)) { map.removeLayer(tiles); vector(); } }, 8000);
  }
  if (opts.zoomControl !== false && !opts.static) L.control.zoom({ position: 'topright' }).addTo(map);
  return markRaw(map);
};

/* ===================================================== */
/*                     COMPONENTES                       */
/* ===================================================== */
const app = createApp({
  setup() {
    // transición de página: cortina naranja/tinta con huellas
    const curtain = ref(null);
    let first = true;
    const leave = (el, done) => {
      if (reduced) return done();
      const c = curtain.value;
      gsap.timeline({ onComplete: done })
        .set(c, { visibility: 'visible' })
        .fromTo(c.querySelectorAll('.curtain__panel'), { scaleY: 0, transformOrigin: 'bottom' }, { scaleY: 1, duration: .55, ease: 'expo.inOut', stagger: .08 })
        .fromTo(c.querySelectorAll('.curtain__paw span'), { y: 40, opacity: 0, scale: .4 }, { y: 0, opacity: 1, scale: 1, stagger: .07, duration: .35, ease: 'back.out(3)' }, '-=.25')
        .to(el, { y: -60, duration: .5, ease: 'expo.in' }, 0);
    };
    const enter = (el, done) => {
      lenis.scrollTo(0, { immediate: true, force: true });
      if (first || reduced) { first = false; ScrollTrigger.refresh(); return done(); }
      const c = curtain.value;
      gsap.timeline({ onComplete: () => { gsap.set(c, { visibility: 'hidden' }); ScrollTrigger.refresh(); done(); } })
        .to(c.querySelectorAll('.curtain__paw span'), { y: -30, opacity: 0, stagger: .05, duration: .25, ease: 'power2.in' })
        .to([...c.querySelectorAll('.curtain__panel')].reverse(), { scaleY: 0, transformOrigin: 'top', duration: .6, ease: 'expo.inOut', stagger: .08 }, '-=.05')
        .fromTo(el, { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: .8, ease: 'expo.out', clearProps: 'transform,opacity' }, '-=.45');
    };
    return { route, ui, curtain, leave, enter, closeAlert };
  },
  template: `

app.component('page-map', {
  setup() {
    const root = ref(null), el = ref(null);
    const f = reactive({ type: 'todos', species: 'todas', q: '' });
    const sel = ref(route.value.query.focus || null);
    const list = computed(() => state.reports
      .filter(r => (f.type === 'todos' || r.type === f.type) && (f.species === 'todas' || r.species === f.species))
      .filter(r => !f.q || `${r.name} ${r.breed} ${r.zone} ${r.color}`.toLowerCase().includes(f.q.toLowerCase()))
      .sort((a, b) => b.date - a.date));
    let map, layer, temp;
    const markers = {};

    const draw = () => {
      layer.clearLayers();
      list.value.forEach(r => {
        const m = L.marker([r.lat, r.lng], { icon: pinIcon(r) })
          .bindPopup(`<div class="pop"><h4>${r.name}</h4><p>${TYPES[r.type].icon} ${TYPES[r.type].label} · ${r.zone} · ${timeAgo(r.date)}</p><button data-open="${r.id}">Ver detalles</button></div>`)
          .on('click', () => (sel.value = r.id));
        markers[r.id] = m; layer.addLayer(m);
      });
    };
    const focus = id => {
      const r = state.reports.find(x => x.id === id); if (!r) return;
      sel.value = id;
      map.flyTo([r.lat, r.lng], 16, { duration: 1.1 });
      setTimeout(() => markers[id] && markers[id].openPopup(), 1150);
    };
    const locate = () => {
      if (!navigator.geolocation) return toast('Tu navegador no permite ubicación');
      navigator.geolocation.getCurrentPosition(p => {
        const ll = [p.coords.latitude, p.coords.longitude];
        L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18] }) }).addTo(map);
        map.flyTo(ll, 15);
        const near = state.reports.filter(r => r.type !== 'reunido' && km({ lat: ll[0], lng: ll[1] }, r) < 5).length;
        toast(`📍 ${near} alertas a menos de 5 km de ti`);
      }, () => toast('No pudimos obtener tu ubicación'));
    };

    usePageFx(root, () => {
      intro('.mapside > *', { x: -40, opacity: 0, stagger: .08, duration: .9, ease: 'expo.out', delay: .2 });
      intro('.map', { scale: .96, opacity: 0, duration: 1.1, ease: 'expo.out', delay: .1 });
    });

    onMounted(() => {
      map = makeMap(el.value, { zoom: 13 });
      layer = L.layerGroup().addTo(map);
      draw();
      map.on('click', e => {
        temp && temp.remove();
        const { lat, lng } = e.latlng;
        temp = L.popup().setLatLng(e.latlng).setContent(`<div class="pop"><h4>¿Reportar aquí?</h4><p>Marca este punto para una mascota perdida o vista.</p><button data-here="${lat.toFixed(5)},${lng.toFixed(5)}">🚨 Reportar en este lugar</button></div>`).openOn(map);
      });
      // los popups de Leaflet cortan la propagación del click, así que escuchamos en fase de captura
      document.addEventListener('click', onPopupClick, true);
      setTimeout(() => { map.invalidateSize(); if (sel.value) focus(sel.value); }, 700);
    });
    const onPopupClick = e => {
      const o = e.target.closest('[data-open]'); if (o) openAlert(o.dataset.open);
      const h = e.target.closest('[data-here]'); if (h) { const [lat, lng] = h.dataset.here.split(','); go(`/publicar?lat=${lat}&lng=${lng}`); }
    };
    watch(list, draw);
    onBeforeUnmount(() => { document.removeEventListener('click', onPopupClick, true); map && map.remove(); });

    return { root, el, f, list, sel, focus, locate, TYPES, SPECIES, timeAgo, status };
  },
  template: `
  <main class="page" ref="root" style="padding-bottom:30px">
    <div class="wrap">
      <div class="mapwrap">
        <aside class="mapside">
          <div><span class="eyebrow">Mapa en vivo<template v-if="status.online"> · <span class="live-dot"></span>conectado</template></span><h1 class="h-md" style="margin-top:8px">Santa Cruz de la Sierra</h1></div>
          <input class="input" v-model="f.q" placeholder="🔎 Buscar por nombre, raza, barrio, color…">
          <div class="filters">
            <button class="chip" :class="{on:f.type==='todos'}" @click="f.type='todos'">Todos</button>
            <button v-for="(t,k) in TYPES" :key="k" class="chip" :class="{on:f.type===k}" @click="f.type=k">{{ t.icon }} {{ t.label }}</button>
          </div>
          <div class="filters">
            <button class="chip" :class="{on:f.species==='todas'}" @click="f.species='todas'">Todas</button>
            <button v-for="(e,k) in SPECIES" :key="k" class="chip" :class="{on:f.species===k}" @click="f.species=k">{{ e }}</button>
          </div>
          <div class="mapside__list" data-lenis-prevent>
            <button v-for="r in list" :key="r.id" class="alert-item" :class="{on:sel===r.id}" @click="focus(r.id)" @dblclick="openAlert(r.id)">
              <div class="thumb" :style="{'--c':TYPES[r.type].color+'22'}"><pet-media :item="r" /></div>
              <div style="min-width:0">
                <h4>{{ r.name }}</h4>
                <p>{{ r.breed }} · {{ r.zone }} · {{ timeAgo(r.date) }}</p>
                <div style="margin-top:6px"><type-tag :type="r.type" /></div>
              </div>
            </button>
            <p v-if="!list.length" class="empty">No hay alertas con esos filtros 🐾</p>
          </div>
          <a href="#/publicar" class="btn btn--orange" style="justify-content:center">🚨 Publicar una alerta</a>
        </aside>
        <div class="map" ref="el" data-lenis-prevent>
          <div class="map__hint">👆 Toca el mapa para reportar en ese punto</div>
          <div class="map__tools"><button class="btn btn--light btn--sm" @click.stop="locate">📍 Cerca de mí</button></div>
        </div>
      </div>
    </div>
  </main>`,
});

app.component('page-publish', {
  setup() {
    const root = ref(null), pick = ref(null), fileIn = ref(null);
    const q = route.value.query;
    const hasPoint = !!(q.lat && q.lng);
    const form = reactive({ type: 'perdido', species: 'perro', name: '', breed: '', color: '', zone: 'Centro', desc: '', reward: '', contact: '', photo: null,
      lat: hasPoint ? +q.lat : CENTER[0], lng: hasPoint ? +q.lng : CENTER[1] });
    // si viene desde el perfil de una mascota, precargamos sus datos
    if (q.pet) {
      const p = state.pets.find(x => x.id === q.pet);
      if (p) Object.assign(form, { name: p.name, species: p.species, breed: p.breed, zone: p.zone, desc: p.bio, photo: p.photo || null, video: p.video, petId: p.id, lat: ZONES[p.zone][0], lng: ZONES[p.zone][1] });
    }
    let map, marker;
    const types = { perdido: ['🚨', 'Perdí a mi mascota'], visto: ['👀', 'Vi una mascota'], encontrado: ['🏠', 'La rescaté'] };

    const onFile = async e => {
      const file = e.target.files[0]; if (!file) return;
      form.photo = await readImage(file); form.video = null;
    };
    watch(() => form.zone, z => {
      if (!map) return;
      form.lat = ZONES[z][0]; form.lng = ZONES[z][1];
      marker.setLatLng(ZONES[z]); map.flyTo(ZONES[z], 15, { duration: .8 });
    });
    const valid = computed(() => form.name.trim() && form.contact.replace(/\D/g, '').length >= 7);
    const sending = ref(false);
    const submit = async () => {
      if (!valid.value) return toast('Completa el nombre y un WhatsApp válido');
      if (sending.value) return;
      sending.value = true;
      try {
        const id = await actions.addReport({ ...form });
        toast('✅ ¡Alerta publicada! Ya está en el mapa');
        go('/mapa?focus=' + id);
        setTimeout(() => openAlert(id), 1700);
      } catch (e) {
        toast('No se pudo publicar: ' + (e.message || 'revisa tu conexión e inténtalo de nuevo'));
      } finally { sending.value = false; }
    };

    usePageFx(root, () => {
      intro('.page__head > *', { y: 40, opacity: 0, stagger: .08, duration: 1, ease: 'expo.out', delay: .15 });
      intro('.publish-layout > *', { y: 60, opacity: 0, stagger: .12, duration: 1, ease: 'expo.out', delay: .3 });
    });
    onMounted(() => {
      map = makeMap(pick.value, { center: [form.lat, form.lng], zoom: hasPoint ? 16 : 14 });
      marker = L.marker([form.lat, form.lng], { draggable: true, icon: pinIcon(form) }).addTo(map);
      const set = ll => { form.lat = ll.lat; form.lng = ll.lng; marker.setLatLng(ll); };
      marker.on('dragend', () => set(marker.getLatLng()));
      map.on('click', e => set(e.latlng));
      watch(() => [form.type, form.species], () => marker.setIcon(pinIcon(form)));
      setTimeout(() => map.invalidateSize(), 700);
    });
    onBeforeUnmount(() => map && map.remove());

    return { root, pick, fileIn, form, types, SPECIES, ZONES, TYPES, onFile, submit, valid, hasPoint, sending };
  },
  template: `
  <main class="page" ref="root">
    <div class="wrap">
      <header class="page__head">
        <span class="eyebrow">Nueva alerta</span>
        <h1 class="h-lg">Publica y deja que <span class="hl">el barrio</span> ayude.</h1>
        <p class="lead">Mientras más detalles des, más fácil será reconocerla. Toma menos de un minuto.</p>
      </header>
      <div class="publish-layout">
        <form class="card form-grid" @submit.prevent="submit">
          <div class="field field--full"><label>¿Qué pasó?</label>
            <div class="seg">
              <button type="button" v-for="(t,k) in types" :key="k" :class="{on:form.type===k}" :style="{'--c':TYPES[k].color}" @click="form.type=k"><em>{{ t[0] }}</em>{{ t[1] }}</button>
            </div>
          </div>
          <div class="field field--full"><label>Especie</label>
            <div class="seg" style="--n:5">
              <button type="button" v-for="(e,k) in SPECIES" :key="k" :class="{on:form.species===k}" @click="form.species=k"><em>{{ e }}</em>{{ k }}</button>
            </div>
          </div>
          <div class="field"><label>{{ form.type==='perdido' ? 'Nombre de tu mascota' : 'Título corto' }} *</label><input class="input" v-model="form.name" :placeholder="form.type==='perdido' ? 'Ej. Toby' : 'Ej. Perrito café con collar'"></div>
          <div class="field"><label>Raza</label><input class="input" v-model="form.breed" placeholder="Ej. Beagle, mestizo…"></div>
          <div class="field"><label>Color / señas</label><input class="input" v-model="form.color" placeholder="Ej. Tricolor, collar rojo"></div>
          <div class="field"><label>Barrio / zona</label><select class="input" v-model="form.zone"><option v-for="(_,z) in ZONES" :key="z">{{ z }}</option></select></div>
          <div class="field field--full"><label>📍 ¿Dónde exactamente? <span class="muted" style="font-weight:400">— toca el mapa o arrastra el pin</span></label>
            <div class="pick-map" ref="pick" data-lenis-prevent></div>

          <div class="field field--full"><label>Foto</label>
            <div class="drop" @click="fileIn.click()">
              <img v-if="form.photo" :src="form.photo" alt="">
              <span v-else style="font-size:2.4rem">📷</span>
              <div><b>{{ form.photo ? 'Cambiar foto' : 'Sube una foto clara' }}</b><br><small class="muted">La comprimimos para que cargue rápido</small></div>
              <input type="file" accept="image/*" ref="fileIn" hidden @change="onFile">

          <div class="field field--full"><button class="btn btn--orange" style="justify-content:center" :disabled="!valid || sending">{{ sending ? 'Publicando…' : 'Publicar alerta en el mapa 🐾' }}</button></div>
        </form>
        <aside class="preview-sticky">
          <p class="eyebrow" style="margin-bottom:12px">Vista previa</p>

app.component('page-pet', {
  setup() {
    const root = ref(null);
    const pet = computed(() => state.pets.find(p => p.id === route.value.params.id));
    const following = ref((state.user.followed || []).includes(route.value.params.id));
    const follow = async () => { following.value = await actions.toggleFollow(pet.value); };
    const alert = computed(() => pet.value && state.reports.find(r => r.type === 'perdido' && (r.petId === pet.value.id || r.name === pet.value.name)));
    const markHome = async () => {
      try {
        if (alert.value && canEdit(alert.value)) await actions.setReportType(alert.value, 'reunido');
        await actions.setPetLost(pet.value, false);
        toast('💚 ¡Qué alegría! Marcada como en casa');
      } catch (e) { toast('No se pudo actualizar: ' + e.message); }
    };
    // QR decorativo determinístico a partir del id
    const qr = computed(() => { let s = [...(pet.value?.id || 'x')].reduce((a, c) => a * 31 + c.charCodeAt(0), 7); return Array.from({ length: 81 }, () => ((s = (s * 9301 + 49297) % 233280) / 233280) > .5); });
    usePageFx(root, () => {
      gsap.from('.profile__media', { clipPath: 'inset(100% 0 0 0 round 28px)', duration: 1.3, ease: 'expo.inOut', delay: .1 });
      intro('.profile__info > *', { y: 40, opacity: 0, stagger: .07, duration: 1, ease: 'expo.out', delay: .4 });
    });
    return { root, pet, following, follow, alert, markHome, qr, share, openAlert, SPECIES, canEdit };
  },
  template: `
  <main class="page" ref="root">
    <div class="wrap" v-if="pet">
      <a href="#/comunidad?tab=perfiles" class="chip" style="margin-bottom:24px">← Perfiles</a>

          <div class="profile__stats">
            <div><b>{{ pet.followers.toLocaleString('es-BO') }}</b><span>seguidores</span></div>
            <div><b>{{ pet.zone }}</b><span>barrio</span></div>
            <div><b>{{ pet.owner }}</b><span>familia</span></div>
          </div>
          <div class="traits" style="margin-bottom:26px"><span v-for="t in pet.traits" :key="t" style="font-size:.9rem;padding:8px 14px">{{ t }}</span></div>
          <div class="flex">
            <button class="btn" :class="following ? 'btn--ghost' : ''" @click="follow">{{ following ? '✓ Siguiendo' : '+ Seguir' }}</button>
            <a v-if="!pet.lost && canEdit(pet)" :href="'#/publicar?pet='+pet.id" class="btn btn--orange">🚨 Reportar como perdida</a>
            <template v-else-if="pet.lost">
              <button v-if="alert" class="btn btn--orange" @click="openAlert(alert.id)">Ver alerta</button>
              <button v-if="canEdit(pet)" class="btn btn--ghost" @click="markHome">💚 Ya volvió a casa</button>
            </template>
            <button class="btn btn--ghost" @click="share(pet.name+' en HUELLAS','#/mascota/'+pet.id)">↗ Compartir</button>
          </div>
          <div class="card mt flex" style="gap:22px;align-items:center">

            <div style="flex:1;min-width:200px"><h3 style="font-size:1.3rem">Placa QR para el collar</h3><p class="muted">Quien encuentre a {{ pet.name }} escanea el QR y te avisa al instante, con su ubicación.</p></div>
          </div>
        </div>
      </div>
    </div>
    <div class="wrap empty" v-else><h2>No encontramos esta mascota 🐾</h2><a href="#/comunidad" class="btn mt">Volver</a></div>
